<style>
  :root{
    --brand:#5B3DF5; --brand2:#FF6B4A;
    --ink:#14112B; --muted:#5D5A73; --line:#E8E6F2;
    --bg:#FAFAFE; --card:#FFFFFF; --soft:#F2F0FF;
    --radius:20px; --shadow:0 10px 30px rgba(20,17,43,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  img{max-width:100%;display:block}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}

  /* Nav */
  nav{position:sticky;top:0;z-index:20;background:rgba(250,250,254,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-weight:800;font-size:1.15rem;text-decoration:none;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .logo img{width:30px;height:30px;border-radius:8px}
  .nav-link{font-weight:600;font-size:.95rem;text-decoration:none;color:var(--muted)}
  .nav-link:hover{color:var(--ink)}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:700;font-size:1.05rem;padding:16px 28px;border-radius:14px;border:0;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
  .btn-buy{background:var(--brand);color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 40%,transparent)}
  .btn-buy:hover{transform:translateY(-2px);box-shadow:0 12px 28px color-mix(in srgb,var(--brand) 50%,transparent)}
  .btn-ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:var(--ink)}
  .btn-sm{padding:11px 18px;font-size:.95rem;border-radius:11px}

  /* Hero */
  .hero{padding:64px 0 56px}
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:var(--brand);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;border-radius:999px}
  h1{font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.08;letter-spacing:-.035em;font-weight:800;margin:18px 0 16px}
  .lead{font-size:1.15rem;color:var(--muted);max-width:34em}
  .price-row{display:flex;align-items:baseline;gap:14px;margin:28px 0 22px;flex-wrap:wrap}
  .price{font-size:2.4rem;font-weight:800;letter-spacing:-.03em}
  .was{color:var(--muted);text-decoration:line-through;font-size:1.2rem}
  .launch{background:#FFF1F3;color:#B0102F;font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:999px}
  .card .launch{font-size:.72rem;padding:3px 9px}
  .company{font-size:.78rem;margin-top:6px}
  .vat{font-size:.82rem;color:var(--muted);margin:-14px 0 20px}
  .save{background:#E7F8F0;color:#0B8A5E;font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:999px}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap}
  .trust{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:.9rem;font-weight:500}

  /* Cover mock-up */
  .mock{position:relative;display:grid;place-items:center;min-height:420px}
  .mock::before{content:"";position:absolute;inset:8% 4%;border-radius:40px;background:radial-gradient(circle at 30% 30%,var(--c1),transparent 60%),radial-gradient(circle at 70% 70%,var(--c2),transparent 60%);opacity:.25;filter:blur(30px)}
  .cover{position:relative;width:min(300px,78%);aspect-ratio:3/4;border-radius:18px;padding:28px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:14px 14px 0 -2px #fff,14px 14px 0 0 var(--line),28px 28px 0 -2px #fff,28px 28px 0 0 var(--line),0 30px 60px rgba(20,17,43,.25);transform:rotate(-3deg)}

  .cover .brandmark{font-size:.75rem;font-weight:700;opacity:.85}
  .mock img.real{position:relative;max-height:460px;width:100%;object-fit:contain;border-radius:18px;box-shadow:0 30px 60px rgba(20,17,43,.25)}

  section{padding:72px 0}

  .sub{color:var(--muted);font-size:1.05rem;margin-bottom:38px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
  .feature{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;transition:transform .2s,box-shadow .2s}

  .feature h3{font-size:1.1rem;margin-bottom:6px;letter-spacing:-.01em}
  .feature p{color:var(--muted);font-size:.95rem}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:32px}
  .panel h3{font-size:1.25rem;margin-bottom:18px;letter-spacing:-.01em}
  .ticks{list-style:none;display:grid;gap:12px}
  .ticks li{display:flex;gap:12px;align-items:flex-start}
  .ticks li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:.8rem;display:grid;place-items:center;margin-top:1px}
  .ticks.dot li::before{content:"→";background:var(--soft);color:var(--brand)}

  /* Bundle upsell */
  .upsell{display:flex;gap:28px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:24px;padding:34px;background:linear-gradient(120deg,#1B1340,var(--brand));color:#fff}
  .upsell h3{font-size:1.5rem;letter-spacing:-.02em;margin:8px 0 6px}
  .upsell p{opacity:.85}
  .upsell .chip{background:rgba(255,255,255,.15);color:#fff}
  .upsell .btn{background:#fff;color:#1B1340}

  /* Reviews */
  .review{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
  .review p{font-size:1rem;margin-bottom:12px}
  .review b{font-size:.9rem;color:var(--muted)}

  /* FAQ */
  .faq{max-width:780px}
  details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 22px;margin-bottom:12px}
  summary{cursor:pointer;list-style:none;font-weight:700;padding:20px 0;display:flex;justify-content:space-between;gap:16px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--brand);transition:transform .2s}
  details[open] summary::after{transform:rotate(45deg)}
  details p{color:var(--muted);padding-bottom:20px}

  /* Final CTA */
  .final{text-align:center}
  .final .box{border-radius:28px;padding:56px 26px;background:var(--soft)}
  .final .price{display:block;margin:14px 0 22px}

  /* Shop cards */

  .filter{font:inherit;font-weight:600;font-size:.92rem;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted)}
  .filter.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .card .thumb{aspect-ratio:16/9;display:grid;place-items:center;font-size:3.4rem;background:linear-gradient(140deg,var(--c1),var(--c2))}
  .card .thumb img{width:100%;height:100%;object-fit:cover}
  .card .body{padding:20px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .cat{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
  .card h3{font-size:1.08rem;line-height:1.3;letter-spacing:-.01em}
  .card .meta{color:var(--muted);font-size:.88rem;flex:1}
  .card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .card .p{font-weight:800;font-size:1.2rem}
  .card .go{font-weight:700;color:var(--brand);font-size:.92rem}

  /* Footer */
  footer{padding:44px 0 110px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
  footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
  .socials{display:flex;gap:16px}
  .socials a{text-decoration:none;font-weight:600}
  .socials a:hover{color:var(--brand)}

  /* Sticky mobile bar */
  .sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 18px;display:none;align-items:center;justify-content:space-between;gap:14px;transform:translateY(100%);transition:transform .25s}
  .sticky.show{transform:none}
  .sticky .t{font-weight:700;font-size:.92rem;line-height:1.25}
  .sticky .t span{display:block;font-weight:800;font-size:1.1rem}

  .toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;font-weight:600;font-size:.92rem;z-index:50;transition:.25s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:860px){
    .hero{padding:36px 0 40px}
    .hero-grid,.two{grid-template-columns:1fr}
    .hero-grid .mock{order:-1;min-height:300px}
    .cover{width:min(230px,64%)}
    .mock:has(img.real){min-height:0;padding:8px 0}
    section{padding:54px 0}
    .sticky{display:flex}
  }
</style>
</head>
<body>

<nav><div class="wrap">
  <a class="logo" href="?" data-home><img id="brandLogo" src="" alt=""><span id="brandName"></span></a>
  <a class="nav-link" href="?" data-home id="navLink">All products</a>
</div></nav>

<main id="app"></main>

<footer><div class="wrap">
  <div><div>© <span id="yr"></span> <span id="footBrand"></span> · <a id="footEmail" href="#"></a></div><div class="company" id="footCompany"></div><div class="company"><a href="terms.html">Terms of Sale</a> · <a href="refunds.html">Refund Policy</a> · <a href="privacy.html">Privacy Policy</a></div></div>
  <div class="socials" id="socials"></div>
</div></footer>

<div class="sticky" id="sticky"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const money = n => STORE.currency + Number(n).toFixed(2);
  const params = new URLSearchParams(location.search);
  const src = (params.get("src") || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 60);

  // Remember where the visitor came from, so it survives clicking around the shop
  let source = src;
  try { if (src) sessionStorage.setItem("src", src); else source = sessionStorage.getItem("src") || ""; } catch(e){}

  // Brand
  document.documentElement.style.setProperty("--brand", STORE.brandColour);
  document.documentElement.style.setProperty("--brand2", STORE.brandColour2);
  $("#brandName").textContent = STORE.name;
  if (STORE.logo) $("#brandLogo").src = STORE.logo; else $("#brandLogo").remove();
  $("#footCompany").textContent = STORE.company || "";
  $("#footBrand").textContent = STORE.name;
  $("#yr").textContent = new Date().getFullYear();
  $("#footEmail").textContent = STORE.email;
  $("#footEmail").href = "mailto:" + STORE.email;
  const socialNames = {tiktok:"TikTok",instagram:"Instagram",youtube:"YouTube",linkedin:"LinkedIn"};
  $("#socials").innerHTML = Object.entries(STORE.socials).filter(([,u]) => u)
    .map(([k,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${socialNames[k]||k}</a>`).join("");

  const link = (q) => { const p = new URLSearchParams(q); if (source) p.set("src", source); const s = p.toString(); return s ? "?" + s : "?"; };
  document.querySelectorAll("[data-home]").forEach(a => a.href = link({}));

  const LIVE = PRODUCTS.filter(p => !p.hidden);
  const byId = id => LIVE.find(p => p.id === id);
  const bundleValue = p => (p.bundleOf || []).reduce((t, id) => t + (byId(id)?.price || 0), 0);

  function checkout(p){
    const url = p.checkoutUrl || "";
    if (!url || url.includes("REPLACE")) return "#";
    try {
      const u = new URL(url);
      if (source) u.searchParams.set("client_reference_id", source);
      return u.toString();
    } catch(e){ return url; }
  }
  const buyAttrs = p => { const h = checkout(p); return h === "#" ? `href="#" data-missing="1"` : `href="${esc(h)}"`; };

  function coverHTML(p){
    const vars = `--c1:${esc(p.colours?.[0]||STORE.brandColour)};--c2:${esc(p.colours?.[1]||STORE.brandColour2)}`;
    if (p.image) return `<div class="mock" style="${vars}"><img class="real" src="${esc(p.image)}" alt="${esc(p.title)}"></div>`;
    return `<div class="mock" style="${vars}"><div class="cover">
      <div class="cs">${esc(p.category)}</div>
      <div class="big">${esc(p.emoji||"✨")}</div>
      <div><div class="ct">${esc(p.title)}</div><div class="brandmark">${esc(p.brand||STORE.name)}</div></div>
    </div></div>`;
  }

  function priceHTML(p){
    let extra = "";
    if (p.compareAt && p.compareAt > p.price) extra += `<span class="was">${money(p.compareAt)}</span>`;
    if (p.regularPrice && p.regularPrice > p.price) extra += `<span class="launch">Launch price · rises to ${money(p.regularPrice)}</span>`;
    const bv = bundleValue(p);
    if (bv > p.price) extra += `<span class="save">Save ${money(bv - p.price)} vs buying separately</span>`;
    return `<div class="price-row"><span class="price">${money(p.price)}</span>${extra}</div>${STORE.vatNote ? `<p class="vat">${esc(STORE.vatNote)}</p>` : ""}`;
  }

  function cardHTML(p){
    const vars = `--c1:${esc(p.colours?.[0]||STORE.brandColour)};--c2:${esc(p.colours?.[1]||STORE.brandColour2)}`;
    return `<a class="card" href="${link({p:p.id})}">
      <div class="thumb" style="${vars}">${p.image ? `<img src="${esc(p.image)}" alt="">` : esc(p.emoji||"✨")}</div>
      <div class="body">
        <div class="cat">${esc(p.category)}</div>
        <h3>${esc(p.title)}</h3>
        <div class="meta">${esc(p.format||"")}</div>
        <div class="foot"><span class="p">${money(p.price)} ${p.regularPrice > p.price ? `<span class="launch">Launch price</span>` : ""}</span><span class="go">View →</span></div>
      </div></a>`;
  }

  /* ---------- Product page ---------- */
  function renderProduct(p){
    document.title = `${p.title} | ${STORE.name}`;
    $("#navLink").textContent = "← All products";
    const bundle = !p.bundleOf && LIVE.find(b => (b.bundleOf||[]).includes(p.id));
    const related = LIVE.filter(x => x.id !== p.id && x.category === p.category && !(p.bundleOf||[]).includes(x.id)).slice(0,3);
    const others = related.length ? related : LIVE.filter(x => x.id !== p.id).slice(0,3);

    $("#app").innerHTML = `
    <header class="hero"><div class="wrap hero-grid">
      <div>
        <span class="chip">⚡ Instant download · ${esc(p.brand||p.category)}</span>
        <h1>${esc(p.title)}</h1>
        <p class="lead">${esc(p.subtitle)}</p>
        ${priceHTML(p)}
        <div class="cta-row">
          <a class="btn btn-buy" ${buyAttrs(p)} id="mainBuy">Get instant access →</a>
          <a class="btn btn-ghost" href="#inside">See what's inside</a>
        </div>
        <div class="trust">
          <span>🔒 Secure checkout by Stripe</span>
          <span>📥 ${esc(p.format||"Instant download")}</span>
          <span>♾️ Yours to keep</span>
        </div>
      </div>
      ${coverHTML(p)}
    </div></header>

    ${p.highlights?.length ? `<section class="alt" id="inside"><div class="wrap">
      <h2>What's inside</h2>
      <p class="sub">${esc(p.insideSub||"")}</p>
      <div class="grid">${p.highlights.map(h => `<div class="feature"><div class="ic">${esc(h.icon)}</div><h3>${esc(h.title)}</h3><p>${esc(h.text)}</p></div>`).join("")}</div>
    </div></section>` : ""}

    <section><div class="wrap two">
      ${p.includes?.length ? `<div class="panel"><h3>Everything you get</h3><ul class="ticks">${p.includes.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>` : ""}
      ${p.forWho?.length ? `<div class="panel"><h3>Who it's for</h3><ul class="ticks dot">${p.forWho.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>` : ""}
    </div></section>

    ${bundle ? `<section style="padding-top:0"><div class="wrap"><div class="upsell">
      <div><span class="chip">Best value</span><h3>${esc(bundle.title)}</h3>
      <p>${money(bundle.price)}${bundleValue(bundle) > bundle.price ? ` — save ${money(bundleValue(bundle)-bundle.price)} vs buying separately` : ""}</p></div>
      <a class="btn" href="${link({p:bundle.id})}">View the bundle →</a>
    </div></div></section>` : ""}

    ${p.reviews?.length ? `<section class="alt"><div class="wrap">
      <h2>What buyers say</h2><p class="sub">Real reviews from real customers.</p>
      <div class="grid">${p.reviews.map(r=>`<div class="review"><p>“${esc(r.text)}”</p><b>— ${esc(r.name)}</b></div>`).join("")}</div>
    </div></section>` : ""}

    ${p.faqs?.length ? `<section ${p.reviews?.length ? "" : 'class="alt"'}><div class="wrap faq">
      <h2>Questions</h2><p class="sub">Anything else? Email <a href="mailto:${esc(STORE.email)}">${esc(STORE.email)}</a></p>
      ${p.faqs.map((f,i)=>`<details ${i===0?"open":""}><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("")}
    </div></section>` : ""}

    <section class="final"><div class="wrap"><div class="box">
      <h2>Ready when you are</h2>
      <p class="sub" style="margin-bottom:0">Download in seconds and start today.</p>
      <span class="price">${money(p.price)}</span>
      ${STORE.vatNote ? `<p class="vat" style="margin:-14px 0 20px">${esc(STORE.vatNote)}</p>` : ""}
      <a class="btn btn-buy" ${buyAttrs(p)}>Get instant access →</a>
      <p class="legal-note" style="margin:16px auto 0">Because this is digital content delivered immediately, by buying you agree to instant access and acknowledge you lose the 14-day cancellation right once the download starts.</p>
    </div></div></section>

    ${others.length ? `<section style="padding-top:0"><div class="wrap">
      <h2>More from ${esc(STORE.name)}</h2><p class="sub">You might also like</p>
      <div class="cards">${others.map(cardHTML).join("")}</div>
    </div></section>` : ""}`;

    // Sticky buy bar (mobile) appears once the main button scrolls away
    const st = $("#sticky");
    st.innerHTML = `<div class="t">${esc(p.title)}<span>${money(p.price)}</span></div><a class="btn btn-buy btn-sm" ${buyAttrs(p)}>Buy now</a>`;
    const io = new IntersectionObserver(([e]) => st.classList.toggle("show", !e.isIntersecting && e.boundingClientRect.top < 0));
    io.observe($("#mainBuy"));
  }

  /* ---------- Shop page ---------- */
  function renderShop(){
    document.title = `${STORE.name} – Shop`;
    $("#navLink").style.visibility = "hidden";
    const cats = [...new Set(LIVE.map(p => p.category))];
    let current = cats.includes(params.get("c")) ? params.get("c") : "All";

    $("#app").innerHTML = `
    <header class="hero" style="padding-bottom:20px"><div class="wrap">
      <span class="chip">⚡ Instant downloads</span>
      <h1>${esc(STORE.tagline)}</h1>
      <p class="lead">${esc(STORE.intro||"Pay securely, download in seconds and keep it forever.")}</p>
    </div></header>
    <section style="padding-top:20px"><div class="wrap">
      ${cats.length > 1 ? `<div class="filters">${["All",...cats].map(c=>`<button class="filter" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
      <div class="cards" id="cards"></div>
    </div></section>`;

    const draw = () => {
      document.querySelectorAll(".filter").forEach(b => b.classList.toggle("on", b.dataset.c === current));
      $("#cards").innerHTML = LIVE.filter(p => current === "All" || p.category === current).map(cardHTML).join("");
    };
    document.querySelectorAll(".filter").forEach(b => b.onclick = () => { current = b.dataset.c; draw(); });
    draw();
  }

  // Friendly reminder if a Stripe link hasn't been added yet
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-missing]");
    if (!a) return;
    e.preventDefault();
    const t = $("#toast");
    t.textContent = "Checkout link not set yet — paste this product's Stripe Payment Link into checkoutUrl.";
    t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200);
  });

  const p = byId(params.get("p") || location.hash.slice(1));
  p ? renderProduct(p) : renderShop();
})();
</script>
</body>
</html>
